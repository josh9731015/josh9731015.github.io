<style>
  :root { color-scheme: light; --bg:#fcfcfb; --card:#fff; --line:#e6e5e0; --ink:#0b0b0b; --ink-2:#52514e; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#1a1a19; --card:#232322; --line:#3a3a38; --ink:#fff; --ink-2:#c3c2b7; --accent:#3987e5; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#1a1a19; --card:#232322; --line:#3a3a38; --ink:#fff; --ink-2:#c3c2b7; --accent:#3987e5; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .meta { color: var(--ink-2); margin-bottom: 32px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px; color:inherit; text-decoration:none; }
  a.card:hover { border-color: var(--accent); }
  a.card b { color: var(--accent); font-size: 18px; }
  a.card span { display:block; color: var(--ink-2); font-size: 15px; margin-top: 4px; }
</style>
